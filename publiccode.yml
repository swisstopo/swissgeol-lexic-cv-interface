description:
  en:
    localisedName: lexic.swissgeol.ch
    shortDescription: lexic.swissgeol.ch is a semantic web based platform for
      controlled geological vocabularies and classifications.
    longDescription: >-
      lexic.swissgeol.ch is a semantic web based platform for controlled
      geological vocabularies and classifications.

      It holds the most relevant geological classifications for Switzerland
      derived and harmonised with the geological data products of swisstopo. 
    features:
      - Manage controlled vocabularies
      - Find geological terms
      - Find geological vocabularies
      - Navigate in semantic graphs
